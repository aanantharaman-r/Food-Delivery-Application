<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="foodieGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4c24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>
  
  <!-- Circular Badge matching Foodie's Circular Logo -->
  <circle cx="32" cy="32" r="30" fill="url(#foodieGrad)" />
  
  <!-- Crossed Spoon and Fork (Utensils) in Crisp White -->
  <g stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Fork diagonal -->
    <path d="M18 46 L38 26" />
    <path d="M38 26 C41 23 44 19 46 16" />
    <path d="M35 17 L41 23" />
    <path d="M39 13 L45 19" />
    <path d="M31 21 L37 27" />

    <!-- Spoon diagonal -->
    <path d="M46 46 L26 26" />
    <ellipse cx="21" cy="21" rx="6" ry="8" transform="rotate(-45 21 21)" fill="#ffffff" stroke="none" />
  </g>
</svg>